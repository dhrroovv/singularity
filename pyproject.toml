[project]
name = "singularity"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# ANN enforces parameter and return type hints; UP enforces modern syntax (X | None, PEP 695)
select = ["F", "E4", "E7", "E9", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.fastapi]
entrypoint = "app.main:app"
